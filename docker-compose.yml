# One command: `docker-compose up` (or `docker compose up`).
# Passwords fall back to local demo values; set your own in .env (see .env.example).
# Compose reads .env automatically for ${...} values. No env_file directive is used,
# so both legacy docker-compose and Compose v2 work.

# Containers never gain privileges after start (no setuid), and the app containers drop
# every Linux capability; none of them needs one.
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-refund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refund_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-refund_support}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the API reaches the database.

  # One-shot: applies pending SQL migrations and loads the demo data, then exits.
  # The API starts only after it succeeds. Both steps are safe to repeat on every start.
  migrate:
    <<: *hardened
    build:
      context: ./backend
      target: runtime
    command: ["sh", "-c", "node dist/database/run-migrations.js && node dist/database/seed/run-seed.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-refund}:${POSTGRES_PASSWORD:-refund_demo_password}@db:5432/${POSTGRES_DB:-refund_support}
      # The demo history is decided under the refund policy, so seeding registers it first.
      POLICY_FILE: /app/policy/refund-policy.yaml
      # Demo customer N (1 to 15) signs in as <local>+N@<domain> of this address, with this password.
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-nwisuanu@gmail.com}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-customer}
    volumes:
      - ./policy:/app/policy:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *hardened
    build:
      context: ./backend
      target: runtime
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-refund}:${POSTGRES_PASSWORD:-refund_demo_password}@db:5432/${POSTGRES_DB:-refund_support}
      POLICY_FILE: /app/policy/refund-policy.yaml
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      # API reference at /docs. Off unless set to true.
      API_DOCS: ${API_DOCS:-false}
      # Any supported provider key; the provider is detected from its prefix. Empty = AI disabled.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Only for Anthropic organization-level keys, which must name a workspace (wrkspc_…).
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      # Per-call AI time limit, and the minimum model confidence for an automatic approval.
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-20000}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.95}
    # The company refund policy, read-only. Edit policy/refund-policy.yaml, then
    # `docker-compose restart api` registers the new version (no rebuild needed).
    volumes:
      - ./policy:/app/policy:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: reached through the web proxy at /api (and /docs when enabled).

  web:
    <<: *hardened
    build:
      context: ./frontend
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
