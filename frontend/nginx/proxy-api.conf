# Proxy settings shared by every /api location.
proxy_pass http://api:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Nginx is the edge: overwrite (never append) client-supplied forwarding headers.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# One ID per request, generated here (a client-supplied one is replaced).
proxy_set_header X-Request-Id $request_id;
proxy_set_header Connection "";
# The slowest request is a chat turn or submission waiting on the AI provider
# (at most AI_TIMEOUT_MS per call, 20 s by default).
proxy_read_timeout 120s;
