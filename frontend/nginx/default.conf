# The combined format plus the request ID that the API also logs and stores on audit events.
log_format with_request_id '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" request_id=$request_id';

# Per-IP request limits, before requests reach the API (which has its own, finer limits).
# Sign-in attempts: only POSTs count, so restoring a session on reload is never limited.
map $request_method $sign_in_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $sign_in_key zone=sign_in:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    access_log /var/log/nginx/access.log with_request_id;

    # Rate-limited API calls get the same JSON error shape as the API's own 429.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"statusCode":429,"message":"Too many requests. Please wait a moment and try again."}';
    }

    # Customer and admin sign-in: a few quick retries, then 429.
    location ~ ^/api/v1/(customer|admin)/session$ {
        limit_req zone=sign_in burst=5 nodelay;
        limit_req zone=api burst=50 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Swagger UI, served by the API with its own security headers. Only when API_DOCS=true.
    location /docs {
        limit_req zone=api burst=50 nodelay;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA entry point: always revalidate so new deployments are picked up.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
